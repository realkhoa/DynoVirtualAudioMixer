name: Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  test-and-build:
    name: Test & Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Frontend Unit Tests
        run: bun test

      - name: Build Frontend Production Assets
        run: bun run build

      - name: Start Windows Audio Service
        shell: powershell
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
          Get-Service -Name Audiosrv -ErrorAction SilentlyContinue

      - name: Run Backend Audio Engine Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose -- --test-threads=1

      - name: Build Tauri Desktop Application
        run: bun x @tauri-apps/cli build --no-bundle

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyno-virtual-audio-mixer-windows-x64
          path: src-tauri/target/release/dyno-virtual-audio-mixer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}" } else { "latest" }
          $title = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }} - Dyno Virtual Audio Mixer" } else { "Dyno Virtual Audio Mixer (Latest Build)" }
          $exePath = "src-tauri/target/release/dyno-virtual-audio-mixer.exe"

          if (!(Test-Path $exePath)) {
            Write-Error "Release executable not found at $exePath"
            exit 1
          }

          Write-Host "Publishing artifact to GitHub Release ($tag)..."
          $releaseJson = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag..."
            gh release upload $tag $exePath --clobber
          } else {
            Write-Host "Creating new release $tag..."
            gh release create $tag $exePath --title "$title" --notes "Automated release build from commit ${{ github.sha }} on ${{ github.ref_name }}." --latest
          }

          # If building from main, also sync artifact to existing v0.1.0 release for convenient access
          if ($tag -eq "latest") {
            Write-Host "Syncing artifact to v0.1.0 release..."
            gh release upload v0.1.0 $exePath --clobber 2>$null
          }
