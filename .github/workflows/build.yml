name: Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  test-and-build:
    name: Test & Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Frontend Unit Tests
        run: bun test

      - name: Build Frontend Production Assets
        run: bun run build

      - name: Start Windows Audio Service
        shell: powershell
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
          Get-Service -Name Audiosrv -ErrorAction SilentlyContinue

      - name: Run Backend Audio Engine Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose -- --test-threads=1

      - name: Build Tauri Desktop Application
        run: bun x @tauri-apps/cli build --no-bundle

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyno-virtual-audio-mixer-windows-x64
          path: src-tauri/target/release/dyno-virtual-audio-mixer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Dyno Virtual Audio Mixer (Latest Build)' }}
          body: |
            ## Dyno Virtual Audio Mixer - Latest Windows Release
            Automated build from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            ### Downloads:
            - **[dyno-virtual-audio-mixer.exe](https://github.com/realkhoa/DynoVirtualAudioMixer/releases/download/latest/dyno-virtual-audio-mixer.exe)** (Standalone Windows x64 executable)
          files: src-tauri/target/release/dyno-virtual-audio-mixer.exe
          make_latest: true
