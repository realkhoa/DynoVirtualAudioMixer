name: Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  test-and-build:
    name: Test & Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Frontend Unit Tests
        run: bun test

      - name: Run Backend Audio Engine Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Frontend Production Assets
        run: bun run build

      - name: Build Tauri Desktop Application
        run: bun x @tauri-apps/cli build --no-bundle

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyno-virtual-audio-mixer-windows-x64
          path: src-tauri/target/release/dyno-virtual-audio-mixer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/dyno-virtual-audio-mixer.exe
          generate_release_notes: true
