<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Audio Waveform / Patch Cables -->
  <path d="M 80 256 C 160 120, 200 390, 280 256 C 330 170, 390 320, 432 256" 
        fill="none" stroke="url(#neonCyan)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Equalizer / Sliders -->
  <line x1="160" y1="140" x2="160" y2="370" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <circle cx="160" cy="220" r="22" fill="#38bdf8" filter="url(#glow)" />

  <line x1="256" y1="100" x2="256" y2="410" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="300" r="24" fill="#4ade80" filter="url(#glow)" />

  <line x1="352" y1="140" x2="352" y2="370" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <circle cx="352" cy="180" r="22" fill="#38bdf8" filter="url(#glow)" />
</svg>
